<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131410" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="InkPane 墨窗控制台：日程、课程、待办与天气在这里整理，按窗格排布后同步到桌面电子墨水屏。"
    />
    <title>InkPane 墨窗 · 控制台</title>
    <script>
      // 在首屏渲染前应用主题，避免暗色模式出现白屏闪烁
      (function () {
        try {
          var stored = localStorage.getItem('inkpane.theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : null;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode || (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>InkPane 墨窗控制台需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
