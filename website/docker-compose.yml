services:
  inkpane:
    build:
      context: .
      dockerfile: Dockerfile
    image: inkpane:latest
    container_name: inkpane
    restart: unless-stopped
    init: true

    # 先复制 server/.env.docker.example 为 server/.env.docker 并修改
    env_file:
      - ./server/.env.docker

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '4000'
      SERVE_STATIC: 'true'
      DATABASE_FILE: /data/inkpane.sqlite

    # 只绑定宿主机回环地址，由 OpenResty 反向代理访问；
    # 不要把 4000 直接暴露到公网。
    ports:
      - '127.0.0.1:4000:4000'

    volumes:
      - inkpane-data:/data

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  inkpane-data:
    name: inkpane-data
