# InkPane OpenResty / Nginx 站点配置
#
# 典型放置位置：
#   /usr/local/openresty/nginx/conf/conf.d/inkpane.conf
#
# 并确认 nginx.conf 的 http {} 中包含：
#   include conf.d/*.conf;
#
# 把 ink.example.com、证书路径改成你自己的。

server {
    listen 80;
    # 需要 IPv6 时再加：listen [::]:80;
    server_name ink.example.com;

    # Let's Encrypt webroot 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # 需要 IPv6 时再加：listen [::]:443 ssl;
    server_name ink.example.com;

    ssl_certificate     /etc/letsencrypt/live/ink.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ink.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # 后端依赖 Host / X-Forwarded-* 做同源校验、Cookie 和客户端 IP 识别
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_read_timeout 60s;
    }
}
